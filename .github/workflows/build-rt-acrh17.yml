# 编译华硕 RT-ACRH17 固件（源码：coolsnowwolf/lede）
# 结构参考 P3TERX/Actions-OpenWrt（MIT），修正了权限、action 版本和 Ubuntu 24.04 依赖

name: Build RT-ACRH17 (lede)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '编译成功后发布 Release'
        type: boolean
        required: false
        default: false
      lede_version:
        description: 'lede 源码版本：pinned 用 lede.lock/feeds.lock 固定的版本，latest 拉最新代码（用于试升级）'
        type: choice
        options:
          - pinned
          - latest
        default: pinned

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: acrh17.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # lede 里 RT-ACRH17 和 RT-AC42U 共用 asus_rt-ac42u 这个机型定义
  DEVICE_SYMBOL: CONFIG_TARGET_ipq40xx_generic_DEVICE_asus_rt-ac42u
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -hT /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 依赖列表来自 lede README
          sudo -E apt-get -qq update
          sudo -E apt-get -y -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev
          sudo -E apt-get -qq clean
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir

      - name: Clone lede source
        working-directory: /workdir
        env:
          LEDE_VERSION: ${{ inputs.lede_version || 'pinned' }}
        run: |
          if [ "$LEDE_VERSION" = pinned ]; then
            pin=$(grep -Ev '^[[:space:]]*(#|$)' "$GITHUB_WORKSPACE/lede.lock" | head -n 1)
            if ! printf '%s' "$pin" | grep -Eqx '[0-9a-f]{40}'; then
              echo "::error::lede.lock 里需要一个完整的 40 位提交 SHA"
              exit 1
            fi
            git init -q openwrt
            git -C openwrt remote add origin "$REPO_URL"
            git -C openwrt fetch -q --depth 1 origin "$pin"
            git -C openwrt checkout -q FETCH_HEAD
            # feeds 也要固定：strongswan、xl2tpd、LuCI 都来自 feeds，不随 lede 提交走
            cp "$GITHUB_WORKSPACE/feeds.lock" openwrt/feeds.conf.default
          else
            git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          fi
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          echo "LEDE_COMMIT=$(git -C openwrt log -1 --format='%h (%cd)' --date=short)" >> "$GITHUB_ENV"
          echo "LEDE_VERSION=$LEDE_VERSION" >> "$GITHUB_ENV"

      - name: Run diy-part1.sh
        run: |
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config and run diy-part2.sh
        run: |
          # files/ 里的文件会原样放进固件根目录
          if [ -d files ]; then cp -r files openwrt/; fi
          cp "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig
          # 机型名写错时 defconfig 会悄悄换成默认机型，这里直接拦下
          if ! grep -q "^${DEVICE_SYMBOL}=y" .config; then
            echo "::error::机型没有被选中（${DEVICE_SYMBOL}），请检查 ${CONFIG_FILE}"
            exit 1
          fi
          # defconfig 会丢弃不存在或依赖不满足的软件包，确认显式选中的包都已启用。
          while IFS= read -r package; do
            if ! grep -Fqx "$package" .config; then
              echo "::error::软件包配置未生效：${package}，请检查软件源及依赖"
              exit 1
            fi
          done < <(grep -E '^CONFIG_PACKAGE_[^=]+=y$' "$GITHUB_WORKSPACE/$CONFIG_FILE")

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile
        run: |
          cd openwrt
          echo "使用 $(nproc) 线程编译"
          make -j"$(nproc)" || make -j1 V=s
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Disk usage
        if: always()
        run: df -hT

      - name: Collect firmware
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          # 记下这次实际用到的源码版本；固件验证没问题后，把这两个文件拷回仓库就能固定到这个版本
          src="$GITHUB_WORKSPACE/openwrt"
          {
            echo "# 来自编译 $BUILD_DATE（$LEDE_VERSION），lede $LEDE_COMMIT"
            git -C "$src" rev-parse HEAD
          } > lede.lock
          {
            echo "# 来自编译 $BUILD_DATE（$LEDE_VERSION）"
            grep -E '^src-git[[:space:]]' "$src/feeds.conf.default" | while read -r type name url; do
              printf '%s %s %s^%s\n' "$type" "$name" "${url%%[;^]*}" "$(git -C "$src/feeds/$name" rev-parse HEAD)"
            done
          } > feeds.lock
          ls -lh
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: RT-ACRH17-${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}

      # 仅在手动开启发布选项且编译成功时发布。
      - name: Publish release
        if: ${{ success() && inputs.release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rt-acrh17-${{ env.BUILD_DATE }}
          name: RT-ACRH17 ${{ env.BUILD_DATE }}
          body: |
            - 源码：coolsnowwolf/lede ${{ env.LEDE_COMMIT }}（${{ env.LEDE_VERSION == 'pinned' && '固定版本' || '最新代码' }}），feeds 版本见附件 `feeds.lock`
            - 默认后台：http://192.168.1.1 ，用户 root，密码 password
            - 刷机用 `squashfs-sysupgrade.bin`，从原厂固件首次刷入的步骤见仓库 README
          files: ${{ env.FIRMWARE }}/*
