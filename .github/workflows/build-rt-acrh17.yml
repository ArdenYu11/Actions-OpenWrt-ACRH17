# 编译华硕 RT-ACRH17 固件（源码：coolsnowwolf/lede）
# 结构参考 P3TERX/Actions-OpenWrt（MIT），修正了权限、action 版本和 Ubuntu 24.04 依赖

name: Build RT-ACRH17 (lede)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '编译完成后发布 Release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: acrh17.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # lede 里 RT-ACRH17 和 RT-AC42U 共用 asus_rt-ac42u 这个机型定义
  DEVICE_SYMBOL: CONFIG_TARGET_ipq40xx_generic_DEVICE_asus_rt-ac42u
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -hT /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 依赖列表来自 lede README
          sudo -E apt-get -qq update
          sudo -E apt-get -y -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev
          sudo -E apt-get -qq clean
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir

      - name: Clone lede source
        working-directory: /workdir
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          echo "LEDE_COMMIT=$(git -C openwrt log -1 --format='%h (%cd)' --date=short)" >> "$GITHUB_ENV"

      - name: Run diy-part1.sh
        run: |
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config and run diy-part2.sh
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig
          # 机型名写错时 defconfig 会悄悄换成默认机型，这里直接拦下
          if ! grep -q "^${DEVICE_SYMBOL}=y" .config; then
            echo "::error::机型没有被选中（${DEVICE_SYMBOL}），请检查 ${CONFIG_FILE}"
            exit 1
          fi

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile
        run: |
          cd openwrt
          echo "使用 $(nproc) 线程编译"
          make -j"$(nproc)" || make -j1 V=s
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Disk usage
        if: always()
        run: df -hT

      - name: Collect firmware
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          ls -lh
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: RT-ACRH17-${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Publish release
        if: inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rt-acrh17-${{ env.BUILD_DATE }}
          name: RT-ACRH17 ${{ env.BUILD_DATE }}
          body: |
            - 源码：coolsnowwolf/lede ${{ env.LEDE_COMMIT }}
            - 默认后台：http://192.168.1.1 ，用户 root，密码 password
            - 从原厂固件首次刷机用文件名含 `initramfs` 的镜像，进入 OpenWrt 后再用 `squashfs-sysupgrade.bin` 升级
          files: ${{ env.FIRMWARE }}/*
